<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8-Man Matchup Console</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#10131a;
  --bg-grid: rgba(255,255,255,0.02);
  --panel:#1a1e29;
  --panel-alt:#20242f;
  --line:#2b3040;
  --line-soft:#232734;
  --text:#e7e5de;
  --text-dim:#8b93a6;
  --teamA:#4a9bd6;
  --teamA-soft:#1c3348;
  --teamA-line:#2c5273;
  --teamB:#d24a3d;
  --teamB-soft:#3a201d;
  --teamB-line:#6b332c;
  --gold:#c9a227;
  --gold-soft:#332c16;
  --good:#4c9f70;
  --warn:#e0883d;
  --r1:#e2483c;
  --r2:#e0883d;
  --r3:#e6c84a;
  --r4:#4caf6e;
  --r5:#4a90d6;
  --radius:4px;
  --font-display:'Oswald','Arial Narrow',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    repeating-linear-gradient(0deg, var(--bg-grid) 0px, var(--bg-grid) 1px, transparent 1px, transparent 28px),
    repeating-linear-gradient(90deg, var(--bg-grid) 0px, var(--bg-grid) 1px, transparent 1px, transparent 28px),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.45;
  min-height:100vh;
}
#app{max-width:980px;margin:0 auto;padding:18px 16px 60px;}
a{color:var(--teamA);}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:.02em;margin:0 0 4px;}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold);
}
.dim{color:var(--text-dim);}
.mono{font-family:var(--font-mono);}
button{font-family:var(--font-body);cursor:pointer;}
button:focus-visible, input:focus-visible, select:focus-visible, label:focus-within{
  outline:2px solid var(--gold);
  outline-offset:2px;
}
input[type=text], input[type=number], select{
  background:var(--panel-alt);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:var(--radius);
  padding:8px 10px;
  font-family:var(--font-body);
  font-size:14px;
  width:100%;
}
input[type=number]{font-family:var(--font-mono);}
label{display:block;}

/* ---------- buttons ---------- */
.btn{
  background:var(--panel-alt);
  border:1px solid var(--line);
  color:var(--text);
  padding:10px 16px;
  border-radius:var(--radius);
  font-size:14px;
  font-weight:500;
  transition:border-color .15s, background .15s;
}
.btn:hover{border-color:var(--gold);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn:disabled:hover{border-color:var(--line);}
.btn-primary{background:var(--gold-soft);border-color:var(--gold);color:#f2e7c2;}
.btn-primary:hover{background:var(--gold);color:#181307;}
.btn-ghost{background:transparent;border-color:var(--line-soft);color:var(--text-dim);padding:6px 10px;font-size:12px;}
.btn-ghost:hover{color:var(--text);}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

/* ---------- header ---------- */
.hud-header{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  border-bottom:1px solid var(--line);
  padding-bottom:14px;margin-bottom:20px;
}
.hud-brand{font-family:var(--font-display);font-size:18px;letter-spacing:.06em;}
.hud-brand .bracket{color:var(--gold);}
.hud-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.hud-badge{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;
  border:1px solid var(--line);border-radius:var(--radius);
  padding:4px 9px;color:var(--text-dim);
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px;}
.sync-dot.busy{background:var(--warn);}
.sync-dot.err{background:var(--teamB);}

/* ---------- panels ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:18px;
}
.panel-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}

/* ---------- setup form ---------- */
.field{margin-bottom:12px;}
.field-label{font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:500;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:720px){.two-col{grid-template-columns:1fr;}}
.roster-grid{display:flex;flex-direction:column;gap:6px;}
.roster-row{display:flex;gap:6px;flex-wrap:wrap;}
.roster-row .player-name{flex:1.3;min-width:90px;}
.roster-row .player-faction{flex:1;min-width:80px;}
.roster-row .player-bcplink{flex:1.2;min-width:100px;}
.linked-field{
  background:var(--panel-alt);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:8px 10px;font-size:14px;color:var(--text-dim);display:flex;align-items:center;
}
.roster-row select{flex:0 0 138px;font-size:12px;padding:8px 6px;}
@media(max-width:520px){.roster-row select{flex:1 1 100%;}}
.list-link{
  font-family:var(--font-mono);font-size:10px;color:var(--gold);text-decoration:none;
  border:1px solid var(--line);border-radius:2px;padding:1px 5px;white-space:nowrap;
}
.list-link:hover{border-color:var(--gold);text-decoration:underline;}
.team-block{border-radius:var(--radius);padding:14px;border:1px solid var(--line);}
.team-block.a{border-color:var(--teamA-line);background:linear-gradient(180deg, var(--teamA-soft) 0%, transparent 60px);}
.team-block.b{border-color:var(--teamB-line);background:linear-gradient(180deg, var(--teamB-soft) 0%, transparent 60px);}
.team-name-input{font-family:var(--font-display);font-size:16px;font-weight:600;margin-bottom:10px;}
.table-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:600px){.table-edit-grid{grid-template-columns:1fr;}}
.table-edit-row{display:flex;align-items:center;gap:8px;}
.table-edit-row .tnum{font-family:var(--font-mono);color:var(--gold);width:26px;flex-shrink:0;}
.radio-row{display:flex;gap:16px;}
.matrix-scroll{overflow-x:auto;}
.matchup-matrix{border-collapse:collapse;font-size:12px;width:100%;min-width:480px;}
.matchup-matrix th, .matchup-matrix td{padding:5px 6px;text-align:center;border:1px solid var(--line-soft);}
.matchup-matrix th{font-family:var(--font-mono);font-size:9px;letter-spacing:.02em;color:var(--text-dim);font-weight:500;}
.matchup-matrix .matrix-name{text-align:left;font-size:12px;white-space:nowrap;color:var(--text);}
.matchup-matrix th.col-highlight,.matchup-matrix td.col-highlight{background:var(--gold-soft);}
.matchup-matrix th.col-highlight{color:var(--gold);font-weight:700;border-top:3px solid var(--gold);}
.matchup-matrix select{width:52px;padding:4px 2px;font-size:12px;background:var(--panel-alt);border:1px solid var(--line);color:var(--text);border-radius:3px;font-weight:600;}
.matchup-matrix select.r1{background:var(--r1);border-color:var(--r1);color:#fff;}
.matchup-matrix select.r2{background:var(--r2);border-color:var(--r2);color:#fff;}
.matchup-matrix select.r3{background:var(--r3);border-color:var(--r3);color:#1a1e29;}
.matchup-matrix select.r4{background:var(--r4);border-color:var(--r4);color:#fff;}
.matchup-matrix select.r5{background:var(--r5);border-color:var(--r5);color:#fff;}
.rating-cell{display:block;width:100%;padding:4px 2px;border-radius:3px;font-weight:700;text-align:center;font-family:var(--font-mono);font-size:12px;}
.rating-cell.r1{background:var(--r1);color:#fff;}
.rating-cell.r2{background:var(--r2);color:#fff;}
.rating-cell.r3{background:var(--r3);color:#1a1e29;}
.rating-cell.r4{background:var(--r4);color:#fff;}
.rating-cell.r5{background:var(--r5);color:#fff;}
.rating-badge{font-family:var(--font-mono);font-size:10px;letter-spacing:.02em;}
.rating-badge.r1{color:var(--r1);}
.rating-badge.r2{color:var(--r2);}
.rating-badge.r3{color:var(--r3);}
.rating-badge.r4{color:var(--r4);}
.rating-badge.r5{color:var(--r5);}
.rating-key{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);}
.rating-key-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;}
.rating-key-item{display:flex;align-items:center;gap:6px;font-size:12px;}
.rating-swatch{width:12px;height:12px;border-radius:2px;display:inline-block;flex-shrink:0;}
.rating-swatch.r1{background:var(--r1);}
.rating-swatch.r2{background:var(--r2);}
.rating-swatch.r3{background:var(--r3);}
.rating-swatch.r4{background:var(--r4);}
.rating-swatch.r5{background:var(--r5);}
.radio-opt{display:flex;align-items:center;gap:6px;font-size:14px;}

/* ---------- war room / draft ---------- */
.warroom{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:760px){.warroom{grid-template-columns:1fr;}}
.side-panel{border-radius:var(--radius);border:1px solid var(--line);padding:14px;}
.side-panel.a{border-color:var(--teamA-line);}
.side-panel.b{border-color:var(--teamB-line);}
.side-title{font-family:var(--font-display);font-size:15px;letter-spacing:.03em;display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.side-title .swatch{width:10px;height:10px;border-radius:2px;}
.a .swatch{background:var(--teamA);}
.b .swatch{background:var(--teamB);}
.pool-count{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-left:auto;}
.pool-list{display:flex;flex-direction:column;gap:6px;}
.pool-item{
  display:flex;align-items:center;gap:8px;
  background:var(--panel-alt);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:7px 9px;font-size:13px;
}
.pool-item input{width:auto;}
.atk-pick-btn{
  flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--panel-alt);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:13px 14px;font-size:14px;color:var(--text);text-align:left;cursor:pointer;
  transition:background .15s,border-color .15s;width:100%;min-width:0;
}
.atk-pick-btn:hover{border-color:var(--gold);}
.atk-pick-btn.selected{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}
.atk-pick-btn .pick-check{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--good);
  font-weight:700;flex-shrink:0;white-space:nowrap;
}
.role-tag{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;
  padding:2px 6px;border-radius:2px;margin-left:auto;flex-shrink:0;
}
.role-tag.def{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);}
.role-tag.atk{background:var(--panel);color:var(--text-dim);border:1px solid var(--line);}

.step-caption{margin-bottom:14px;}
.step-caption .step-num{font-family:var(--font-mono);color:var(--gold);}

/* signature: accept/refuse dossier */
.vs-wrap{
  position:relative;
  border:1px solid var(--gold);
  border-radius:var(--radius);
  background:
    linear-gradient(180deg, rgba(201,162,39,.05), transparent 40%),
    var(--panel);
  padding:20px 16px 16px;
  margin:16px 0;
}
.vs-wrap::before,.vs-wrap::after{
  content:"";position:absolute;width:16px;height:16px;
  border-color:var(--gold);border-style:solid;
}
.vs-wrap::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}
.vs-wrap::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}
.vs-label{font-family:var(--font-mono);font-size:11px;color:var(--gold);letter-spacing:.12em;margin-bottom:10px;}
.vs-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;}
@media(max-width:600px){.vs-grid{grid-template-columns:1fr;}}
.vs-divider{font-family:var(--font-display);font-size:20px;color:var(--text-dim);text-align:center;}
.vs-def{
  font-family:var(--font-mono);font-size:13px;color:var(--text);
  border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:center;background:var(--panel-alt);
}
.atk-options{display:flex;flex-direction:column;gap:8px;}
.atk-card{
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel-alt);padding:10px 12px;font-size:13px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
button.atk-card{font-family:inherit;color:inherit;text-align:left;width:100%;cursor:pointer;transition:border-color .15s;}
button.atk-card:hover{border-color:var(--gold);}
button.atk-card:hover .tap-hint{color:var(--gold);}
.atk-card .tap-hint{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--text-dim);flex-shrink:0;white-space:nowrap;}
.atk-card.r1{border-color:var(--r1);background:linear-gradient(90deg, rgba(226,72,60,.16), transparent);}
.atk-card.r2{border-color:var(--r2);background:linear-gradient(90deg, rgba(224,136,61,.16), transparent);}
.atk-card.r3{border-color:var(--r3);background:linear-gradient(90deg, rgba(230,200,74,.16), transparent);}
.atk-card.r4{border-color:var(--r4);background:linear-gradient(90deg, rgba(76,175,110,.16), transparent);}
.atk-card.r5{border-color:var(--r5);background:linear-gradient(90deg, rgba(74,144,214,.16), transparent);}
.atk-card.chosen{border-color:var(--good);background:linear-gradient(90deg, rgba(76,159,112,.12), transparent);}
.atk-card .stamp{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--good);border:1px solid var(--good);padding:2px 6px;border-radius:2px;}
.atk-card.faded{opacity:.4;}

/* ---------- table grid ---------- */
.table-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:760px){.table-grid{grid-template-columns:repeat(2,1fr);}}
.table-card{
  border:1px dashed var(--line);border-radius:var(--radius);
  padding:10px;min-height:92px;background:var(--panel-alt);
  display:flex;flex-direction:column;gap:6px;
}
.table-card.filled{border-style:solid;}
.table-card .tid{font-family:var(--font-mono);color:var(--gold);font-size:12px;}
.table-card .mission{font-size:11px;color:var(--text-dim);}
.table-card .matchup{font-size:12px;margin-top:auto;}
.table-card .matchup .p{display:block;}
.table-card .p.a{color:var(--teamA);}
.table-card .p.b{color:var(--teamB);}
.table-card .empty-tag{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-top:auto;}
.table-pick-btn{
  text-align:left;width:100%;
}

/* ---------- scoring ---------- */
.score-row{
  display:grid;grid-template-columns:50px 1fr 78px 78px 1fr 60px;gap:10px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line-soft);
}
@media(max-width:640px){.score-row{grid-template-columns:1fr;gap:6px;}}
.score-row input[type=number]{font-size:17px;font-weight:600;padding:10px 6px;text-align:center;}
.score-row .pname{font-size:13px;display:flex;align-items:center;gap:6px;}
.turn-toggle{
  background:var(--panel-alt);border:1px solid var(--line);border-radius:50%;
  width:20px;height:20px;font-size:11px;line-height:1;padding:0;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;color:var(--text-dim);
  flex-shrink:0;
}
.turn-toggle:hover{border-color:var(--gold);color:var(--text);}
.turn-toggle.active{background:var(--gold);border-color:var(--gold);color:#181307;}
.score-row .pname.a{color:var(--teamA);}
.score-row .pname.b{color:var(--teamB);}
.score-row .tlabel{font-family:var(--font-mono);font-size:11px;color:var(--gold);}
.score-vs{font-family:var(--font-display);color:var(--text-dim);text-align:center;}
.pts-preview{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);text-align:right;}
.round-tracker{display:flex;gap:3px;grid-column:1 / -1;margin-top:4px;}
.round-seg{
  flex:1;text-align:center;font-family:var(--font-mono);font-size:10px;padding:4px 2px;
  border:1px solid var(--line);border-radius:2px;background:var(--panel-alt);color:var(--text-dim);
  cursor:pointer;transition:background .15s,border-color .15s,color .15s;
}
.round-seg:hover{border-color:var(--gold);color:var(--text);}
.round-seg.reached{border-color:var(--gold-soft);background:var(--gold-soft);color:var(--gold);}
.round-seg.current{border-color:var(--gold);background:var(--gold);color:#181307;font-weight:700;}

/* ---------- standings ---------- */
.standings-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px;
}
.standings-row:last-child{border-bottom:none;}
.big-score{font-family:var(--font-mono);font-size:26px;}
.score-banner{display:flex;justify-content:space-around;align-items:center;padding:14px 0;}
.score-banner .side{text-align:center;}
.score-banner .side.a .big-score{color:var(--teamA);}
.score-banner .side.b .big-score{color:var(--teamB);}
.score-banner .who{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);letter-spacing:.08em;}
.winner-strip{
  text-align:center;font-family:var(--font-display);letter-spacing:.05em;
  padding:8px;border-radius:var(--radius);margin-bottom:10px;
  background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);
}

.note{font-size:12px;color:var(--text-dim);margin-top:10px;}
.landing-card{max-width:420px;margin:60px auto 0;}
.pick-list{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.pick-row{display:flex;gap:6px;align-items:stretch;}
.pick-btn{
  flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--panel-alt);border:1px solid var(--line);color:var(--text);
  border-radius:var(--radius);padding:10px 12px;font-size:14px;text-align:left;
  transition:border-color .15s;
}
.pick-btn:hover{border-color:var(--gold);}
.pick-name{font-weight:500;}
.pick-code{font-size:11px;color:var(--text-dim);letter-spacing:.06em;}
.pick-del{flex:0 0 auto;font-size:14px;padding:6px 10px;}
.pick-del:hover{color:var(--teamB);border-color:var(--teamB);}
.error-text{color:var(--teamB);font-size:12px;margin-top:6px;}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;}
}
</style>
</head>

} catch(e){ console.error('Firebase init failed:', e); firebaseReady = false; }

function sanitizeKey(key){
  // Realtime Database paths can't contain . $ # [ ] or /
  return String(key).replace(/[.$#\[\]/]/g, '_');
}

// Drop-in replacement for the window.storage API this app was originally built
// against: shared:true goes to Firebase (visible to your whole team), shared:false
// stays in this browser's own localStorage (per-device, e.g. "last code I used").
const storage = {
  async get(key, shared){
    if (shared === false){
      const raw = localStorage.getItem(key);
      return raw != null ? { key, value: raw, shared } : null;
    }
    if (!firebaseReady) throw new Error('Firebase is not configured yet — see firebaseConfig at the top of the script');
    const snap = await fbDb.ref(sanitizeKey(key)).once('value');
    return snap.exists() ? { key, value: snap.val(), shared } : null;
  },
  async set(key, value, shared){
    if (shared === false){
      localStorage.setItem(key, value);
      return { key, value, shared };
    }
    if (!firebaseReady) throw new Error('Firebase is not configured yet — see firebaseConfig at the top of the script');
    await fbDb.ref(sanitizeKey(key)).set(value);
    return { key, value, shared };
  },
  async delete(key, shared){
    if (shared === false){
      localStorage.removeItem(key);
      return { key, deleted: true, shared };
    }
    if (!firebaseReady) throw new Error('Firebase is not configured yet — see firebaseConfig at the top of the script');
    await fbDb.ref(sanitizeKey(key)).remove();
    return { key, deleted: true, shared };
  }
};

  if (state.setupComplete){

/* ---------------- model ---------------- */
const DISPOSITIONS = ['Disruption','Take and Hold','Purge the Foe','Priority Assets','Reconnaissance'];
function extractBcpEventName(doc){
  const title = doc.querySelector('title');
  if (title && title.textContent){
    const t = title.textContent.split('|')[0].trim();
    if (t) return t;
  }
  const heading = doc.querySelector('h1, h2, h3');
  if (heading && heading.textContent && heading.textContent.trim()) return heading.textContent.trim();
  return '';
}
function parseBcpRosterHtml(htmlText){
  const doc = new DOMParser().parseFromString(htmlText, 'text/html');
  const eventName = extractBcpEventName(doc);
  const root = doc.body || doc.documentElement;
  const items = [];
  const walker = doc.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
  let node = walker.currentNode;
  while (node){
    if (node.tagName === 'P'){
      const text = (node.textContent || '').trim();
      if (text) items.push({type:'p', text});
    } else if (node.tagName === 'A'){
      const href = node.getAttribute('href') || '';
      const m = href.match(/\/list\/[A-Za-z0-9_-]+/);
      if (m) items.push({type:'link', href: m[0]});
    }
    node = walker.nextNode();
  }
  const captainIdxs = [];
  items.forEach((it,i)=>{ if (it.type==='p' && /^team captain:/i.test(it.text)) captainIdxs.push(i); });
  if (!captainIdxs.length) return { teams: [], eventName, error: 'No "Team Captain:" rows found — this doesn\'t look like a BCP roster page. Make sure you copied the Roster tab, and grabbed the whole page (or at least the section with all the teams), not just one team.' };
  const dispositionsLower = DISPOSITIONS.map(d=>d.toLowerCase());
  const teams = captainIdxs.map((capIdx, teamIdx)=>{
    const teamName = (items[capIdx-1] && items[capIdx-1].type==='p') ? items[capIdx-1].text : `Team ${teamIdx+1}`;
    const sectionEnd = (teamIdx+1 < captainIdxs.length) ? captainIdxs[teamIdx+1]-1 : items.length;
    const players = [];
    let cur = null;
    for (let i=capIdx+1; i<sectionEnd; i++){
      const it = items[i];
      if (it.type === 'link'){
        if (cur) cur.listLink = 'https://www.bestcoastpairings.com' + it.href;
        continue;
      }
      const dashIdx = it.text.lastIndexOf(' - ');
      let matchedDisposition = null;
      if (dashIdx >= 0){
        const tail = it.text.slice(dashIdx+3).trim().toLowerCase();
        const dIdx = dispositionsLower.indexOf(tail);
        if (dIdx >= 0) matchedDisposition = DISPOSITIONS[dIdx];
      }
      if (matchedDisposition && cur){
        cur.faction = it.text.slice(0, dashIdx).trim();
        cur.disposition = matchedDisposition;
      } else {
        let name = it.text;
        const clubDash = name.lastIndexOf(' - ');
        if (clubDash >= 0) name = name.slice(0, clubDash).trim();
        cur = { name, faction:'', disposition:'', listLink:'' };
        players.push(cur);
      }
    }
    return { name: teamName, players };
  });
  return { teams, eventName, error: null };
}
function blankPlayers(prefix){
  return Array.from({length:8}, (_,i)=>`${prefix} ${i+1}`);
}
function blankMatchupRatings(){
  return Array.from({length:8}, ()=>({}));
}
function defaultDispositions(){
  // a valid 8-player spread (every disposition at least once, three doubled up) — edit per real roster
  return ['Disruption','Disruption','Take and Hold','Take and Hold','Purge the Foe','Purge the Foe','Priority Assets','Reconnaissance'];
}
let linkedProfileCache = {};
async function refreshLinkedProfiles(){
  if (!state) return;
  const codes = [state.teamA && state.teamA.linkedProfileCode, state.teamB && state.teamB.linkedProfileCode].filter(Boolean);
  for (const code of codes){
    try {
      const res = await storage.get(TEAM_PREFIX+code, true);
      if (res && res.value) linkedProfileCache[code] = JSON.parse(res.value);
    } catch(e){ /* keep whatever was cached before, if anything */ }
  }
}
async function refreshTrackedOpponentProfiles(){
  if (!teamProfile || !teamProfile.trackedOpponents) return;
  for (const code of teamProfile.trackedOpponents){
    try {
      const res = await storage.get(TEAM_PREFIX+code, true);
      if (res && res.value) linkedProfileCache[code] = JSON.parse(res.value);
    } catch(e){ /* keep whatever was cached before, if anything */ }
  }
}
function linkedFieldLookup(team, playerName, field){
  if (!team.linkedProfileCode) return undefined;
  const linked = linkedProfileCache[team.linkedProfileCode];
  if (!linked || !linked.players) return undefined;
  const lidx = linked.players.indexOf(playerName);
  if (lidx < 0) return undefined;
  const arr = linked[field];
  return (arr && arr[lidx] != null && arr[lidx] !== '') ? arr[lidx] : undefined;
}
function getDisposition(side, playerName){
  const team = (side==='a' || side==='A') ? state.teamA : state.teamB;
  const linked = linkedFieldLookup(team, playerName, 'dispositions');
  if (linked !== undefined) return linked;
  const idx = team.players.indexOf(playerName);
  return (idx>=0 && team.dispositions) ? (team.dispositions[idx] || '') : '';
}
function getFaction(side, playerName){
  const team = (side==='a' || side==='A') ? state.teamA : state.teamB;
  const linked = linkedFieldLookup(team, playerName, 'factions');
  if (linked !== undefined) return linked;
  const idx = team.players.indexOf(playerName);
  return (idx>=0 && team.factions) ? (team.factions[idx] || '') : '';
}
function getBcpLink(side, playerName){
  const team = (side==='a' || side==='A') ? state.teamA : state.teamB;
  const linked = linkedFieldLookup(team, playerName, 'bcpLinks');
  if (linked !== undefined) return linked;
  const idx = team.players.indexOf(playerName);
  return (idx>=0 && team.bcpLinks) ? (team.bcpLinks[idx] || '') : '';
}
function getMatchupRating(side, playerName, opponentDisposition){
  if (!opponentDisposition) return null;
  const team = (side==='a' || side==='A') ? state.teamA : state.teamB;
  if (team.linkedProfileCode){
    const linked = linkedProfileCache[team.linkedProfileCode];
    if (linked && linked.players){
      const lidx = linked.players.indexOf(playerName);
      if (lidx>=0 && linked.matchupRatings && linked.matchupRatings[lidx]){
        const lr = linked.matchupRatings[lidx][opponentDisposition];
        if (lr!=null && lr!=='') return lr;
      }
    }
  }
  const idx = team.players.indexOf(playerName);
  if (idx<0 || !team.matchupRatings || !team.matchupRatings[idx]) return null;
  const r = team.matchupRatings[idx][opponentDisposition];
  return (r===undefined || r===null || r==='') ? null : r;
}
function findTrackedOpponentCode(myLinked, oppTeam){
  if (!myLinked || !myLinked.trackedOpponents || !myLinked.trackedOpponents.length) return null;
  // Prefer an explicit link — the opponent's profile was formally imported into this event
  if (oppTeam.linkedProfileCode && myLinked.trackedOpponents.includes(oppTeam.linkedProfileCode)){
    return oppTeam.linkedProfileCode;
  }
  // Fall back to matching by team name — covers the common case where the
  // opponent's roster was just typed in for this event rather than imported
  // via their profile code (which I usually wouldn't have on hand for them).
  const oppNameLower = (oppTeam.name || '').trim().toLowerCase();
  if (!oppNameLower) return null;
  for (const code of myLinked.trackedOpponents){
    const idxEntry = indexCache.teams.find(t=>t.code===code);
    if (idxEntry && idxEntry.name && idxEntry.name.trim().toLowerCase() === oppNameLower) return code;
  }
  return null;
}
function getEffectiveMatchupRating(side, playerName, oppSide, oppName){
  // Prefer a specific opponent-team rating (from a tracked opponent-specific
  // matrix) over the generic disposition-based one, when this opponent's team
  // is one I'm tracking and I've rated this exact player.
  const myTeam = (side==='a' || side==='A') ? state.teamA : state.teamB;
  const oppTeam = (oppSide==='a' || oppSide==='A') ? state.teamA : state.teamB;
  const myLinked = myTeam.linkedProfileCode ? linkedProfileCache[myTeam.linkedProfileCode] : null;
  const oppCode = findTrackedOpponentCode(myLinked, oppTeam);
  if (oppCode){
    const myIdx = myLinked.players ? myLinked.players.indexOf(playerName) : -1;
    if (myIdx>=0 && myLinked.teamMatchupRatings && myLinked.teamMatchupRatings[myIdx]){
      const specific = myLinked.teamMatchupRatings[myIdx][`${oppCode}::${oppName}`];
      if (specific!=null && specific!=='') return specific;
    }
  }
  return getMatchupRating(side, playerName, getDisposition(oppSide, oppName));
}

function dispositionSpread(team){
  const counts = {};
  DISPOSITIONS.forEach(d=>counts[d]=0);
  (team.dispositions||[]).forEach(d=>{ if (d) counts[d] = (counts[d]||0)+1; });
  const vals = DISPOSITIONS.map(d=>counts[d]||0);
  const allPresent = vals.every(v=>v>=1);
  const sorted = [...vals].sort((a,b)=>b-a);
  const shapeOk = allPresent && JSON.stringify(sorted)===JSON.stringify([2,2,2,1,1]);
  return { counts, shapeOk };
}

/* ---------------- scoring ---------------- */
function computePoints(a, b, mode){
  if (a==null || b==null || isNaN(a) || isNaN(b)) return null;
  if (mode === 'simple'){
    if (a>b) return [1,0];
    if (b>a) return [0,1];
    return [0.5,0.5];
  }
  const diff = Math.abs(a-b);
  if (diff <= 5) return [10,10];
  const extra = diff - 5;
  const tier = Math.min(10, Math.ceil(extra/5));
  const hi = 10+tier, lo = 10-tier;
  return a>b ? [hi,lo] : [lo,hi];
}
function roundTotals(round){
  let ta=0, tb=0, complete=true;
  round.pairings.forEach(p=>{
    const pts = computePoints(p.scoreA, p.scoreB, state.scoringMode);
    if (!pts){ complete=false; return; }
    ta += pts[0]; tb += pts[1];
  });
  return { ta, tb, complete };
}
function eventStandings(){
  let ta=0, tb=0, roundsWonA=0, roundsWonB=0, roundsDrawn=0, playedRounds=0;
  state.rounds.forEach(r=>{
    if (r.status !== 'complete') return;
    const t = roundTotals(r);
    ta += t.ta; tb += t.tb; playedRounds++;
    if (t.ta > t.tb) roundsWonA++; else if (t.tb > t.ta) roundsWonB++; else roundsDrawn++;
  });
  return { ta, tb, roundsWonA, roundsWonB, roundsDrawn, playedRounds };
}

function route(){
  if (!authenticated){ app.innerHTML = passwordGateHTML(); return; }
  if (mode === 'team'){
    app.innerHTML = teamProfile ? (teamProfileHeaderHTML() + teamProfileBodyHTML()) : landingHTML();
    return;
  }
  if (!state){ app.innerHTML = landingHTML(); return; }
  if (!state.setupComplete){ app.innerHTML = header() + setupHTML(); return; }
  const round = curRound();
  if (round.status === 'drafting') app.innerHTML = header() + draftHTML(round);
  else if (round.status === 'scoring') app.innerHTML = header() + scoringHTML(round);
  else app.innerHTML = header() + completeHTML(round);
}

function teamMatrixHTML(team){
  const opponents = (team.trackedOpponents || []).map(code => {
    const found = indexCache.teams.find(t=>t.code===code);
    const full = linkedProfileCache[code];
    return {
      code,
      name: found ? found.name : code,
      players: (full && full.players) ? full.players : [],
      factions: (full && full.factions) ? full.factions : [],
      bcpLinks: (full && full.bcpLinks) ? full.bcpLinks : []
    };
  });
  if (!opponents.length){
    return `<p class="note" style="margin-top:0;">No opponent teams added yet — pick one below to start tracking.</p>`;
  }
  return opponents.map(o => opponentMatrixBlockHTML(team, o)).join('');
}
function opponentMatrixBlockHTML(team, o){
  const headerCells = team.players.map((p,i)=>`<th>${esc(p)}${plainFactionTag(team.factions[i])}${plainListLink(team.bcpLinks[i])}</th>`).join('');
  const oppRoster = o.players.length ? o.players : [null]; // null = no roster yet, still show one placeholder row
  const rows = oppRoster.map((op, opIdx)=>{
    if (op === null){
      return `<tr><td class="matrix-name dim">no roster yet</td>${team.players.map(()=>`<td><span class="dim">—</span></td>`).join('')}</tr>`;
    }
    const oppLabel = `<td class="matrix-name">${esc(op)}${plainFactionTag(o.factions[opIdx])}${plainListLink(o.bcpLinks[opIdx])}</td>`;
    const ratingCells = team.players.map((p,i)=>{
      const ratings = (team.teamMatchupRatings && team.teamMatchupRatings[i]) || {};
      const key = `${o.code}::${op}`;
      const val = ratings[key]!=null ? ratings[key] : '';
      return `<td><select class="${val!==''?'r'+val:''}" data-action="set-team-matchup" data-idx="${i}" data-opponent="${esc(key)}">
        <option value=""${val===''?' selected':''}>—</option>
        ${[1,2,3,4,5].map(n=>`<option value="${n}" ${String(val)===String(n)?'selected':''}>${n}</option>`).join('')}
      </select></td>`;
    }).join('');
    return `<tr>${oppLabel}${ratingCells}</tr>`;
  }).join('');
  return `<div style="margin-bottom:18px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <span style="font-family:var(--font-display);font-size:14px;">${esc(o.name)}</span>
      <button type="button" class="btn-ghost" data-action="remove-tracked-opponent" data-opponent="${esc(o.code)}" style="padding:1px 5px;font-size:9px;" title="Stop tracking this team">✕ remove</button>
    </div>
    <div class="matrix-scroll"><table class="matchup-matrix">
      <thead><tr><th></th>${headerCells}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

/* ---------------- draft (per round, per chunk phase) ---------------- */
function draftHTML(round){
  const c = round.chunk;
  let body = '';
  if (c.phase === 'nominateDefenders') body = nominateDefendersHTML(round);
  else if (c.phase === 'nominateAttackers') body = nominateAttackersHTML(round);
  else if (c.phase === 'acceptRefuse') body = acceptRefuseHTML(round);
  else if (c.phase === 'assignTables') body = assignTablesHTML(round);
  else if (c.phase === 'finalTables') body = finalTablesHTML(round);
  return `
  <div class="panel">
    <div class="step-caption">
      <span class="eyebrow">${sectionName(round)}</span><br>
      <span class="step-num mono">${phaseLabel(c.phase)}</span>
    </div>
    ${body}
  </div>
  ${ourMatrixPreviewHTML(round)}
  ${tableGridHTML(round)}`;
}
function ourOpponentSpecificPreviewHTML(myLinked, oppCode, oppTeamName, remainingPlayers, highlightPlayer){
  const oppProfile = linkedProfileCache[oppCode];
  const oppPlayers = (oppProfile && oppProfile.players) ? oppProfile.players : [];
  const oppFactions = (oppProfile && oppProfile.factions) ? oppProfile.factions : [];
  const oppBcpLinks = (oppProfile && oppProfile.bcpLinks) ? oppProfile.bcpLinks : [];
  const headerCells = remainingPlayers.map(p=>{
    const isHighlighted = highlightPlayer && p === highlightPlayer;
    return `<th class="${isHighlighted ? 'col-highlight' : ''}">${esc(p)}</th>`;
  }).join('');
  const roster = oppPlayers.length ? oppPlayers : [null];
  const rows = roster.map((op, opIdx)=>{
    if (op === null){
      return `<tr><td class="matrix-name dim">no roster loaded for ${esc(oppTeamName)}</td>${remainingPlayers.map(()=>`<td><span class="dim">—</span></td>`).join('')}</tr>`;
    }
    const oppLabel = `<td class="matrix-name">${esc(op)}${plainFactionTag(oppFactions[opIdx])}${plainListLink(oppBcpLinks[opIdx])}</td>`;
    const cells = remainingPlayers.map(p=>{
      const myIdx = myLinked.players ? myLinked.players.indexOf(p) : -1;
      const ratings = (myIdx>=0 && myLinked.teamMatchupRatings && myLinked.teamMatchupRatings[myIdx]) || {};
      const val = ratings[`${oppCode}::${op}`];
      const isHighlighted = highlightPlayer && p === highlightPlayer;
      return `<td class="${isHighlighted ? 'col-highlight' : ''}">${val!=null ? `<span class="rating-cell r${val}">${val}</span>` : '<span class="dim">—</span>'}</td>`;
    }).join('');
    return `<tr>${oppLabel}${cells}</tr>`;
  }).join('');
  return `<div class="matrix-scroll"><table class="matchup-matrix">
    <thead><tr><th></th>${headerCells}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}
function ourMatrixPreviewHTML(round){
  const remaining = round.poolA;
  const total = state.teamA.players.length;
  const pendingDefender = round.chunk.phase === 'nominateDefenders' ? round.chunk.nomA.defender : null;
  const myLinked = state.teamA.linkedProfileCode ? linkedProfileCache[state.teamA.linkedProfileCode] : null;
  const oppCode = findTrackedOpponentCode(myLinked, state.teamB);
  let titleSuffix = '';
  let body;
  if (!remaining.length){
    body = '<p class="note" style="margin-top:0;">All your players are paired for this round.</p>';
  } else if (oppCode){
    titleSuffix = ` vs ${esc(state.teamB.name)}`;
    body = ourOpponentSpecificPreviewHTML(myLinked, oppCode, state.teamB.name, remaining, pendingDefender);
  } else {
    body = matchupMatrixReadOnlyHTML('a', state.teamA, remaining, pendingDefender);
  }
  return `<div class="panel">
    <div class="panel-title"><h3>📊 ${esc(state.teamA.name)}'s matchup matrix${titleSuffix}</h3><span class="dim mono" style="font-size:11px;">${remaining.length} OF ${total} REMAINING</span></div>
    ${body}
    ${ratingKeyHTML()}
  </div>`;
}
function sectionName(round){
  const n = Math.floor(round.pairings.length/2) + 1;
  return { 1:'INITIAL SKIRMISH 1', 2:'INITIAL SKIRMISH 2', 3:'MAIN ENGAGEMENT', 4:'CHAMPION SYSTEM' }[n] || `SECTION ${n}`;
}

function phaseLabel(phase){
  return {
    nominateDefenders: "PICK EACH TEAM'S DEFENDER",
    nominateAttackers: "PICK EACH TEAM'S 2 ATTACKERS",
    acceptRefuse: 'ACCEPT ONE ATTACKER, REFUSE THE OTHER',
    assignTables: 'DEFENDERS CLAIM A TABLE + LAYOUT',
    finalTables: 'ASSIGN THE LAST TWO TABLES + LAYOUTS'
  }[phase] || '';
}

function nominationStatusHTML(round){
  const c = round.chunk;
  const missing = [];
  [['a', state.teamA.name, c.nomA], ['b', state.teamB.name, c.nomB]].forEach(([side, name, nom])=>{
    if (nom.attackers.length < 2) missing.push(`${esc(name)}: pick ${2-nom.attackers.length} more attacker${2-nom.attackers.length>1?'s':''}`);
  });
  if (!missing.length) return `<p class="note" style="color:var(--good);">✓ Ready — both teams have 2 attackers picked.</p>`;
  return `<p class="note">Still needed: ${missing.join(' · ')}</p>`;
}

function champPreviewHTML(round){
  if (round.poolA.length !== 4 || round.poolB.length !== 4) return '';
  const c = round.chunk;
  if (!c.nomA.defender || c.nomA.attackers.length<2 || !c.nomB.defender || c.nomB.attackers.length<2) return '';
  const leftoverA = round.poolA.find(p=>p!==c.nomA.defender && !c.nomA.attackers.includes(p));
  const leftoverB = round.poolB.find(p=>p!==c.nomB.defender && !c.nomB.attackers.includes(p));
  if (!leftoverA || !leftoverB) return '';
  return `<div class="note" style="margin-top:14px;border-top:1px dashed var(--line);padding-top:10px;">
    <span class="eyebrow">CHAMPION MATCH PREVIEW</span><br>
    Whoever's left out of this round's nominations locks into the very last game: <b>${esc(leftoverA)}${dispTag('a',leftoverA)}</b> vs <b>${esc(leftoverB)}${dispTag('b',leftoverB)}</b>. Whichever two players get refused this round will play each other on the table right before it.
  </div>`;
}

function atkCardHTML(player, chosen, field, side, defSide, defName){
  const isChosen = chosen === player;

  const rating = getEffectiveMatchupRating(defSide, defName, side, player);
  const ratingClass = rating!=null ? 'r'+rating : '';
  const ratingLine = rating!=null ? `<br>${ratingBadgeHTML(rating)}` : '';
  if (isChosen){
    return `<div class="atk-card chosen ${ratingClass}">
      <span>${esc(player)}${dispTag(side, player)}${listLinkHTML(side, player)}${ratingLine}</span>
      <span class="stamp">ACCEPTED</span>

  return `<div style="display:flex;align-items:center;gap:8px;">

/* ---------------- scoring screen ---------------- */
function ptsPreviewHTML(p){
  const pts = computePoints(p.scoreA, p.scoreB, state.scoringMode);
  if (!pts) return '—';
  if (state.scoringMode === 'simple') return `${pts[0]}–${pts[1]}`;
  const diff = Math.abs((p.scoreA||0)-(p.scoreB||0));
  return `Δ${diff} → ${pts[0]}–${pts[1]}`;
}
const WTC_MARGIN = 12; // 8-player team win margin, per the 11th ed Teams Event Companion
function roundOutcome(round){
  const t = roundTotals(round);
  const diff = t.ta - t.tb;
  const outcome = diff >= WTC_MARGIN ? 'A' : diff <= -WTC_MARGIN ? 'B' : 'DRAW';
  return { diff, outcome, ta: t.ta, tb: t.tb };
}
function outcomeHeadlineHTML(round){
  const { diff, outcome } = roundOutcome(round);
  const color = outcome==='A' ? 'var(--teamA)' : outcome==='B' ? 'var(--teamB)' : 'var(--gold)';
  const label = outcome==='A' ? `${esc(state.teamA.name)} WIN` : outcome==='B' ? `${esc(state.teamB.name)} WIN` : 'DRAW';
  const leadText = diff===0 ? 'Tied' : diff>0 ? `${esc(state.teamA.name)} +${diff}` : `${esc(state.teamB.name)} +${-diff}`;
  return `<span style="color:${color};">${leadText} — currently a ${label}</span>`;
}
function outcomeDetailHTML(round){
  const { diff } = roundOutcome(round);
  const aNeeds = Math.max(0, WTC_MARGIN - diff);
  const bNeeds = Math.max(0, WTC_MARGIN + diff);
  const aLine = aNeeds===0 ? `${esc(state.teamA.name)} have already secured the win margin.` : `${esc(state.teamA.name)} need the gap to move ${aNeeds} more their way to lock in a win.`;
  const bLine = bNeeds===0 ? `${esc(state.teamB.name)} have already secured the win margin.` : `${esc(state.teamB.name)} need the gap to move ${bNeeds} more their way to lock in a win.`;
  return `${aLine}<br>${bLine}<br>A margin of 11 or less either way ends the round in a draw.`;
}
function updateScorePreviews(round, changedTableId){
  if (changedTableId != null){
    const p = round.pairings.find(p=>p.tableId===changedTableId);
    const el = document.getElementById(`pts-${changedTableId}`);
    if (p && el) el.textContent = ptsPreviewHTML(p);
  }
  const t = roundTotals(round);

/* ---------------- state transitions ---------------- */
function setByPath(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for (let i=0;i<parts.length-1;i++){
    const key = /^\d+$/.test(parts[i]) ? parseInt(parts[i]) : parts[i];
    cur = cur[key];
  }
  const last = /^\d+$/.test(parts[parts.length-1]) ? parseInt(parts[parts.length-1]) : parts[parts.length-1];
  cur[last] = value;
}

function afterChunkConfirmed(round){
  const c = round.chunk;
  // capture who got refused this chunk, in case this is the chunk that brings the pool down to its last two per side
  const refusedA = c.acceptForB ? c.nomA.attackers.find(p=>p!==c.acceptForB) : null;
  const refusedB = c.acceptForA ? c.nomB.attackers.find(p=>p!==c.acceptForA) : null;

  c.confirmed.forEach(p=>round.pairings.push(p));

  const nextChunk = freshChunk();
  if (round.poolA.length === 2 && round.poolB.length === 2){
    // Last two per side: this round's two refused attackers play each other (2nd-to-last table),
    // and the two players never even offered — the Champions — play the very last game. Both automatic.
    const leftoverA = round.poolA.find(p=>p!==refusedA) || round.poolA[0];
    const leftoverB = round.poolB.find(p=>p!==refusedB) || round.poolB[0];
    nextChunk.confirmed = [
      { playerA: refusedA, playerB: refusedB, defenderSide:'final', tableId:null, layout:null, scoreA:null, scoreB:null, battleRound:'D', activeTurn:null },
      { playerA: leftoverA, playerB: leftoverB, defenderSide:'final', tableId:null, layout:null, scoreA:null, scoreB:null, battleRound:'D', activeTurn:null }
    ];
    nextChunk.phase = 'finalTables';
    round.poolA = []; round.poolB = [];
  } else if (round.poolA.length === 0){
    round.status = 'scoring';
  } else {
    nextChunk.phase = 'nominateDefenders';
  }
  round.chunk = nextChunk;
}

app.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'submit-password'){
    const input = document.getElementById('app-password');
    const val = input ? input.value : '';
    if (val === APP_PASSWORD){
      setAuthed();
      await attemptAutoLoad();
      route();
    } else {
      const err = document.getElementById('password-error');
      if (err) err.textContent = 'Incorrect password.';
    }
    return;
  }
  if (action === 'logout'){
    clearAuthed();
    state = null; currentCode = null;
    teamProfile = null; teamProfileCode = null;
    mode = 'event';
    route();
    return;
  }
  if (action === 'copy-spectator-link'){
    const url = `${window.location.origin}${window.location.pathname}?spectate=${state.code}`;
    try {
      await navigator.clipboard.writeText(url);
      alert(`Spectator link copied:\n${url}\n\nShare this with anyone — no password needed, view-only, no matchup ratings shown.`);
    } catch(e){
      prompt('Copy this spectator link:', url);
    }
    return;
  }
  if (action === 'go-home'){
    try { await storage.delete(LAST_CODE_KEY, false); } catch(err){ /* non-fatal */ }
    try { await storage.delete(LAST_TEAM_CODE_KEY, false); } catch(err){ /* non-fatal */ }
    state = null; currentCode = null;
    teamProfile = null; teamProfileCode = null;
    mode = 'event';
    await refreshIndex();
    route();
    return;
  }
  if (action === 'refresh-index'){
    await refreshIndex();
    route();
    return;
  }
  if (action === 'confirm-bcp-import'){
    if (!bcpImportPreview || !bcpImportPreview.teams) return;
    const mine = bcpImportPreview.teams.find(t=>t.isMine);
    if (!mine){ alert('Pick which team is yours first.'); return; }
    const nameInput = document.getElementById('bcp-import-event-name');
    const eventName = (nameInput ? nameInput.value : (bcpImportPreview.eventName||'')).trim();

    const code = randomCode();
    const ev = newEvent(code);
    ev.name = eventName;
    ev.teamA.name = mine.name;
    mine.players.slice(0,8).forEach((p,i)=>{
      ev.teamA.players[i] = p.name || ev.teamA.players[i];
      ev.teamA.factions[i] = p.faction || '';
      if (p.disposition) ev.teamA.dispositions[i] = p.disposition;
      ev.teamA.bcpLinks[i] = p.listLink || '';
    });
    ev.opponentTeams = bcpImportPreview.teams.filter(t=>t.selected && !t.isMine).map(t=>{
      const players = t.players.slice(0,8).map(p=>p.name);
      const factions = t.players.slice(0,8).map(p=>p.faction||'');
      const dispositions = t.players.slice(0,8).map(p=>p.disposition||'');
      const bcpLinks = t.players.slice(0,8).map(p=>p.listLink||'');
      while (players.length < 8){ players.push(`Player ${players.length+1}`); factions.push(''); dispositions.push(''); bcpLinks.push(''); }
      return { name: t.name, players, factions, dispositions, bcpLinks };
    });

    state = ev;
    currentCode = code;
    mode = 'event';
    await saveState();
    await persistLastCode();
    await refreshIndex();
    bcpImportPreview = null;
    route();
    return;
  }
  if (action === 'cancel-bcp-import'){
    bcpImportPreview = null;
    route();
    return;
  }
  if (action === 'create-team-profile'){
    const code = randomCode();
    teamProfile = newTeamProfile(code);
    teamProfileCode = code;
    mode = 'team';
    await saveTeamProfile();
    await persistLastTeamCode();
    await refreshIndex();
    route();
    return;
  }
  if (action === 'create-event'){
    const code = randomCode();
    state = newEvent(code);
    currentCode = code;
    mode = 'event';
    await saveState();
    await persistLastCode();
    await refreshIndex();
    route();
    return;
  }
  if (action === 'pick-team'){
    const found = await tryLoadTeamProfile(el.dataset.code);
    if (found){ mode = 'team'; await persistLastTeamCode(); await refreshIndex(); await refreshTrackedOpponentProfiles(); }
    route();
    return;
  }
  if (action === 'pick-event'){
    const found = await tryLoad(el.dataset.code);
    if (found){ mode = 'event'; await persistLastCode(); await refreshIndex(); }
    route();
    return;
  }
  if (action === 'delete-team'){
    const code = el.dataset.code, name = el.dataset.name;
    if (!window.confirm(`Delete team profile "${name}" (${code})? This can't be undone.`)) return;
    try { await storage.delete(TEAM_PREFIX+code, true); } catch(err){ /* non-fatal */ }
    await removeIndexEntry('teams', code);
    if (teamProfileCode === code){ teamProfile = null; teamProfileCode = null; }
    route();
    return;
  }
  if (action === 'delete-event'){
    const code = el.dataset.code, name = el.dataset.name;
    if (!window.confirm(`Delete event "${name}" (${code})? This can't be undone.`)) return;
    try { await storage.delete(STORAGE_PREFIX+code, true); } catch(err){ /* non-fatal */ }
    await removeIndexEntry('events', code);
    if (currentCode === code){ state = null; currentCode = null; }
    route();
    return;
  }
  if (action === 'toggle-bulk-mode'){
    const list = el.dataset.list;
    bulkMode[list] = !bulkMode[list];
    bulkSelected[list].clear();
    route();
    return;
  }
  if (action === 'bulk-delete'){
    const list = el.dataset.list;
    const codes = Array.from(bulkSelected[list]);
    if (!codes.length) return;
    const noun = list === 'teams' ? 'team profile' : 'event';
    if (!window.confirm(`Delete ${codes.length} ${noun}${codes.length!==1?'s':''}? This can't be undone.`)) return;
    const prefix = list === 'teams' ? TEAM_PREFIX : STORAGE_PREFIX;
    for (const code of codes){
      try { await storage.delete(prefix+code, true); } catch(err){ /* non-fatal, keep going */ }
      await removeIndexEntry(list, code);
      if (list === 'teams' && teamProfileCode === code){ teamProfile = null; teamProfileCode = null; }
      if (list === 'events' && currentCode === code){ state = null; currentCode = null; }
    }
    bulkSelected[list].clear();
    bulkMode[list] = false;
    route();
    return;
  }
  if (action === 'join-event'){
    const input = document.getElementById('landing-code');
    const errEl = document.getElementById('landing-error');
    const code = (input ? input.value : '').trim();
    if (!code){ if (errEl) errEl.textContent = 'Enter a code first.'; return; }
    const found = await tryLoad(code);
    if (!found){ if (errEl) errEl.textContent = `No event found for code ${code.toUpperCase()}.`; return; }
    mode = 'event';
    await persistLastCode();
    route();
    return;
  }
  if (action === 'refresh'){
    if (currentCode){
      try{
        const res = await storage.get(STORAGE_PREFIX+currentCode, true);
        if (res && res.value){ state = JSON.parse(res.value); migrateState(); }
      }catch(err){ /* ignore */ }
    }
    await refreshLinkedProfiles();
    route();
    return;
  }
  if (action === 'open-team-profile'){
    const input = document.getElementById('team-profile-code');
    const errEl = document.getElementById('team-profile-error');
    const code = (input ? input.value : '').trim();
    if (!code){ if (errEl) errEl.textContent = 'Enter a code first.'; return; }
    const found = await tryLoadTeamProfile(code);
    if (!found){ if (errEl) errEl.textContent = `No team profile found for code ${code.toUpperCase()}.`; return; }
    mode = 'team';
    await persistLastTeamCode();
    await refreshIndex();
    await refreshTrackedOpponentProfiles();
    route();
    return;
  }
  if (action === 'refresh-profile'){
    if (teamProfileCode){
      try{
        const res = await storage.get(TEAM_PREFIX+teamProfileCode, true);
        if (res && res.value){ teamProfile = JSON.parse(res.value); migrateTeamProfile(); }
      }catch(err){ /* ignore */ }
    }
    await refreshIndex();
    await refreshTrackedOpponentProfiles();
    route();
    return;
  }
  if (action === 'goto-team-profile'){
    mode = 'team';
    if (!teamProfile){
      try {
        const last = await storage.get(LAST_TEAM_CODE_KEY, false);
        if (last && last.value){
          const code = JSON.parse(last.value).code;
          await tryLoadTeamProfile(code);
        }
      } catch(err){ /* fall through to landing */ }
    }
    await refreshIndex();
    await refreshTrackedOpponentProfiles();
    route();
    return;
  }
  if (action === 'add-tracked-opponent'){
    if (!teamProfile) return;
    const select = document.getElementById('add-opponent-select');
    const code = select ? select.value : null;
    if (!code) return;
    if (!teamProfile.trackedOpponents) teamProfile.trackedOpponents = [];
    if (!teamProfile.trackedOpponents.includes(code)) teamProfile.trackedOpponents.push(code);
    scheduleSaveProfile();
    await refreshTrackedOpponentProfiles();
    route();
    return;
  }
  if (action === 'remove-tracked-opponent'){
    if (!teamProfile) return;
    const code = el.dataset.opponent;
    teamProfile.trackedOpponents = (teamProfile.trackedOpponents||[]).filter(c=>c!==code);
    if (teamProfile.teamMatchupRatings){
      teamProfile.teamMatchupRatings.forEach(r=>{
        if (!r) return;
        Object.keys(r).forEach(k=>{ if (k.startsWith(code+'::')) delete r[k]; });
      });
    }
    scheduleSaveProfile();
    route();
    return;
  }
  if (action === 'start-event-from-profile'){
    const code = randomCode();
    state = newEvent(code);
    state.teamA.name = teamProfile.name;
    state.teamA.players = [...teamProfile.players];
    state.teamA.dispositions = [...teamProfile.dispositions];
    state.teamA.factions = [...teamProfile.factions];
    state.teamA.bcpLinks = [...(teamProfile.bcpLinks || Array(8).fill(''))];
    state.teamA.matchupRatings = teamProfile.matchupRatings.map(r=>({...r}));
    state.teamA.linkedProfileCode = teamProfile.code;
    linkedProfileCache[teamProfile.code] = teamProfile;
    currentCode = code;
    mode = 'event';
    await saveState();
    await persistLastCode();
    route();
    return;
  }
  if (action === 'import-profile'){
    const codeInput = document.getElementById('import-profile-code');
    const errEl = document.getElementById('import-error');
    const code = (codeInput ? codeInput.value : '').trim().toUpperCase();
    if (!code){ if (errEl) errEl.textContent = 'Choose or enter a team profile first.'; return; }
    try {
      const res = await storage.get(TEAM_PREFIX+code, true);
      if (res && res.value){
        const profile = JSON.parse(res.value);
        const target = el.dataset.target === 'A' ? state.teamA : state.teamB;
        target.name = profile.name || target.name;
        target.players = [...(profile.players || target.players)];
        target.dispositions = [...(profile.dispositions || defaultDispositions())];
        target.factions = [...(profile.factions || Array(8).fill(''))];
        target.bcpLinks = [...(profile.bcpLinks || Array(8).fill(''))];
        target.matchupRatings = (profile.matchupRatings || blankMatchupRatings()).map(r=>({...r}));
        target.linkedProfileCode = code;
        linkedProfileCache[code] = profile;
        scheduleSave(); route();
      } else if (errEl){
        errEl.textContent = `No team profile found for code ${code}.`;
      }
    } catch(err){
      if (errEl) errEl.textContent = 'Could not load that team profile — try again.';
    }
    return;
  }
  if (action === 'unlink-team'){
    const side = el.dataset.side;
    const team = side==='a' ? state.teamA : state.teamB;
    const linked = team.linkedProfileCode ? linkedProfileCache[team.linkedProfileCode] : null;
    if (linked && linked.players){
      team.players.forEach((p,i)=>{
        const lidx = linked.players.indexOf(p);
        if (lidx>=0){
          if (linked.dispositions) team.dispositions[i] = linked.dispositions[lidx];
          if (linked.factions) team.factions[i] = linked.factions[lidx];
          if (linked.bcpLinks) team.bcpLinks[i] = linked.bcpLinks[lidx];
          if (linked.matchupRatings) team.matchupRatings[i] = {...linked.matchupRatings[lidx]};
        }
      });
    }
    delete team.linkedProfileCode;
    scheduleSave(); route();
    return;
  }
  if (action === 'finish-setup'){
    state.setupComplete = true;
    // round 1 was seeded with placeholder names when the event was first created,
    // before the real roster existed — refresh it now with the actual roster
    const round1 = state.rounds[0];
    round1.poolA = [...state.teamA.players];
    round1.poolB = [...state.teamB.players];
    round1.oppName = state.teamB.name;
    scheduleSave();
    route();
    return;
  }
  if (action === 'pick-first-opponent'){
    const select = document.getElementById('first-opponent-select');
    const idx = select ? parseInt(select.value) : -1;
    const opp = state.opponentTeams[idx];
    if (!opp) return;
    state.teamB = {
      name: opp.name,
      players: [...opp.players],
      dispositions: [...(opp.dispositions || defaultDispositions())],
      factions: [...(opp.factions || Array(8).fill(''))],
      bcpLinks: [...(opp.bcpLinks || Array(8).fill(''))],
      matchupRatings: blankMatchupRatings()
    };
    scheduleSave();
    route();
    return;
  }
  if (action === 'undo-first-opponent'){
    state.teamB = { name:'Team Beta', players: blankPlayers('Player'), dispositions: defaultDispositions(), factions: Array(8).fill(''), matchupRatings: blankMatchupRatings(), bcpLinks: Array(8).fill('') };
    scheduleSave();
    route();
    return;
  }
  if (action === 'pick-table'){
    const round = curRound();
    const idx = parseInt(el.dataset.idx);
    round.chunk.confirmed[idx].tableId = parseInt(el.dataset.table);
    scheduleSave(); route();
    return;
  }
  if (action === 'pick-final-table'){
    const round = curRound();
    const idx = parseInt(el.dataset.idx);
    round.chunk.confirmed[idx].tableId = parseInt(el.dataset.table);
    scheduleSave(); route();
    return;
  }
  if (action === 'pick-layout' || action === 'pick-final-layout'){
    const round = curRound();
    const idx = parseInt(el.dataset.idx);
    round.chunk.confirmed[idx].layout = el.dataset.layout;
    scheduleSave(); route();
    return;
  }
  if (action === 'choose-attacker'){
    const round = curRound();
    round.chunk[el.dataset.field] = el.dataset.player;
    scheduleSave(); route();
    return;
  }
  if (action === 'pick-defender'){
    const round = curRound();
    const side = el.dataset.side, player = el.dataset.player;
    const nom = side==='a' ? round.chunk.nomA : round.chunk.nomB;
    nom.defender = player;
    nom.attackers = nom.attackers.filter(p=>p!==player);
    scheduleSave(); route();
    return;
  }
  if (action === 'pick-attacker'){
    const round = curRound();
    const side = el.dataset.side, player = el.dataset.player;
    const nom = side==='a' ? round.chunk.nomA : round.chunk.nomB;
    if (nom.attackers.includes(player)){
      nom.attackers = nom.attackers.filter(p=>p!==player);
    } else {
      if (nom.attackers.length >= 2) return;
      nom.attackers.push(player);
    }
    scheduleSave(); route();
    return;
  }
  if (action === 'confirm-defenders'){
    const round = curRound();
    const c = round.chunk;
    if (!c.nomA.defender || !c.nomB.defender) return;
    c.phase = 'nominateAttackers';
    scheduleSave(); route();
    return;
  }
  if (action === 'confirm-attackers'){
    const round = curRound();
    const c = round.chunk;
    if (c.nomA.attackers.length!==2 || c.nomB.attackers.length!==2) return;
    c.phase = 'acceptRefuse';
    scheduleSave(); route();
    return;
  }
  if (action === 'confirm-accept-refuse'){
    const round = curRound();
    const c = round.chunk;
    const pairing1 = { playerA: c.nomA.defender, playerB: c.acceptForA, defenderSide:'A', tableId:null, layout:null, scoreA:null, scoreB:null, battleRound:'D', activeTurn:null };
    const pairing2 = { playerA: c.acceptForB, playerB: c.nomB.defender, defenderSide:'B', tableId:null, layout:null, scoreA:null, scoreB:null, battleRound:'D', activeTurn:null };
    // remove the defender + accepted attacker from each pool; the refused attacker was
    // never removed from the pool in the first place, so it's already back where it belongs
    round.poolA = round.poolA.filter(p=>p!==c.nomA.defender && p!==c.acceptForB);
    round.poolB = round.poolB.filter(p=>p!==c.nomB.defender && p!==c.acceptForA);
    c.confirmed = [pairing1, pairing2];
    c.phase = 'assignTables';
    scheduleSave(); route();
    return;
  }
  if (action === 'confirm-tables'){
    const round = curRound();
    if (!round.chunk.confirmed.every(p=>p.tableId && p.layout)) return;
    afterChunkConfirmed(round);
    scheduleSave(); route();
    return;
  }
  if (action === 'confirm-final-tables'){
    const round = curRound();
    if (!round.chunk.confirmed.every(p=>p.tableId && p.layout)) return;
    round.chunk.confirmed.forEach(p=>round.pairings.push(p));
    round.status = 'scoring';
    round.chunk = freshChunk();
    scheduleSave(); route();
    return;
  }
  if (action === 'set-battle-round'){
    const round = curRound();
    const tableId = parseInt(el.dataset.table);
    const p = round.pairings.find(p=>p.tableId===tableId);
    if (p){
      p.battleRound = el.dataset.round;
      scheduleSave();
      route();
    }
    return;
  }
  if (action === 'set-active-turn'){
    const round = curRound();
    const tableId = parseInt(el.dataset.table);
    const p = round.pairings.find(p=>p.tableId===tableId);
    if (p){
      p.activeTurn = (p.activeTurn === el.dataset.side) ? null : el.dataset.side;
      scheduleSave();
      route();
    }
    return;
  }
  if (action === 'submit-scores'){
    const round = curRound();
    const allFilled = round.pairings.every(p=>p.scoreA!=null && p.scoreB!=null && !isNaN(p.scoreA) && !isNaN(p.scoreB));
    if (!allFilled){
      const errEl = document.getElementById('score-error');
      if (errEl) errEl.textContent = 'Enter a VP total for both players on every table before submitting.';
      return;
    }
    round.status = 'complete';
    scheduleSave(); route();
    return;
  }
  if (action === 'edit-scores'){
    const round = curRound();
    round.status = 'scoring';
    scheduleSave(); route();
    return;
  }
  if (action === 'next-round'){
    const num = state.rounds.length + 1;
    state.rounds.push(newRound(num, state.teamA.players, state.teamB.players, state.teamB.name));
    state.currentRound = state.rounds.length - 1;
    scheduleSave(); route();
    return;
  }
  if (action === 'next-round-with-opponent'){
    const select = document.getElementById('next-round-opponent-select');
    const idx = select ? parseInt(select.value) : -1;
    const opp = state.opponentTeams[idx];
    if (!opp) return;
    state.teamB = {
      name: opp.name,
      players: [...opp.players],
      dispositions: [...(opp.dispositions || defaultDispositions())],
      factions: [...(opp.factions || Array(8).fill(''))],
      bcpLinks: [...(opp.bcpLinks || Array(8).fill(''))],
      matchupRatings: blankMatchupRatings()
    };
    const num = state.rounds.length + 1;
    state.rounds.push(newRound(num, state.teamA.players, state.teamB.players, opp.name));
    state.currentRound = state.rounds.length - 1;
    scheduleSave(); route();
    return;
  }
});

app.addEventListener('change', async (e)=>{
  const el = e.target;
  if (el.dataset.action === 'toggle-bulk-select'){
    const list = el.dataset.list, code = el.dataset.code;
    if (el.checked) bulkSelected[list].add(code); else bulkSelected[list].delete(code);
    route();
    return;
  }
  if (el.dataset.action === 'bcp-file-selected'){
    const file = el.files && el.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = parseBcpRosterHtml(text);
      if (parsed.error){
        bcpImportPreview = { error: parsed.error, teams: [], eventName: parsed.eventName || '' };
      } else {
        bcpImportPreview = {
          error: null,
          eventName: parsed.eventName || '',
          teams: parsed.teams.map((t,i) => ({ ...t, selected: true, isMine: i===0 }))
        };
      }
    } catch(err){
      bcpImportPreview = { error: 'Could not read that file — try again.', teams: [], eventName: '' };
    }
    bcpImportSummary = null;
    route();
    return;
  }
  if (el.dataset.action === 'toggle-bcp-team'){
    const idx = parseInt(el.dataset.idx);
    if (bcpImportPreview && bcpImportPreview.teams && bcpImportPreview.teams[idx]){
      bcpImportPreview.teams[idx].selected = el.checked;
    }
    return;
  }
  if (el.dataset.action === 'set-bcp-mine'){
    const idx = parseInt(el.dataset.idx);
    if (bcpImportPreview && bcpImportPreview.teams){
      bcpImportPreview.teams.forEach((t,i)=>{ t.isMine = (i===idx); });
    }
    return;
  }
  if (el.dataset.action === 'set-scoring'){
    state.scoringMode = el.value;
    scheduleSave();
    return;
  }
  if (el.dataset.action === 'set-disposition'){
    const side = el.dataset.side, idx = parseInt(el.dataset.idx);
    const team = side==='p' ? teamProfile : (side==='a' ? state.teamA : state.teamB);
    team.dispositions[idx] = el.value;
    if (side==='p') scheduleSaveProfile(); else scheduleSave();
    route();
    return;
  }
  if (el.dataset.action === 'set-matchup'){
    const side = el.dataset.side, idx = parseInt(el.dataset.idx), disp = el.dataset.disp;
    const team = side==='p' ? teamProfile : (side==='a' ? state.teamA : state.teamB);
    if (!team.matchupRatings[idx]) team.matchupRatings[idx] = {};
    team.matchupRatings[idx][disp] = el.value ? parseInt(el.value) : null;
    if (side==='p') scheduleSaveProfile(); else scheduleSave();
    route();
    return;
  }
  if (el.dataset.action === 'set-team-matchup'){
    if (!teamProfile) return;
    const idx = parseInt(el.dataset.idx), opponentCode = el.dataset.opponent;
    if (!teamProfile.teamMatchupRatings) teamProfile.teamMatchupRatings = blankMatchupRatings();
    if (!teamProfile.teamMatchupRatings[idx]) teamProfile.teamMatchupRatings[idx] = {};
    teamProfile.teamMatchupRatings[idx][opponentCode] = el.value ? parseInt(el.value) : null;
    scheduleSaveProfile();
    route();
    return;
  }
});

app.addEventListener('input', (e)=>{
  const el = e.target;
  if (el.dataset.bind){
    if (el.dataset.bind.startsWith('profile.')){
      setByPath(teamProfile, el.dataset.bind.slice('profile.'.length), el.value);
      scheduleSaveProfile();
    } else {
      setByPath(state, el.dataset.bind, el.value);
      scheduleSave();
    }
    return;
  }
  if (el.dataset.bindScore){
    const round = curRound();
    const tableId = parseInt(el.dataset.table);
    const p = round.pairings.find(p=>p.tableId===tableId);
    if (p){
      let val = el.value === '' ? null : parseFloat(el.value);
      if (val != null && !isNaN(val)){
        if (val > 100){ val = 100; el.value = 100; }
        else if (val < 0){ val = 0; el.value = 0; }
      } else if (val != null){
        val = null; // non-numeric entry, treat as empty
      }
      if (el.dataset.bindScore === 'A') p.scoreA = val; else p.scoreB = val;
      scheduleSave();
      updateScorePreviews(round, tableId);
    }
    return;
  }
});

app.addEventListener('keydown', (e)=>{
  if (e.key !== 'Enter' || !e.target) return;
  const map = { 'landing-code':'join-event', 'team-profile-code':'open-team-profile', 'app-password':'submit-password' };
  const action = map[e.target.id];
  if (action){
    const btn = document.querySelector(`[data-action="${action}"]`);
    if (btn) btn.click();
  }
});

/* ---------------- boot ---------------- */
function notConfiguredHTML(){
  return `
  <div class="hud-header"><div class="hud-brand"><span class="bracket">[</span> 8-MAN MATCHUP CONSOLE <span class="bracket">]</span></div></div>
  <div class="panel landing-card">
    <div class="eyebrow" style="color:var(--warn);">SETUP NEEDED</div>
    <h2>Firebase isn't configured yet</h2>
    <p class="dim" style="font-size:13px;">This page can't save or sync anything until it's connected to a Firebase project. Open this file's source, find the <code>firebaseConfig</code> object near the top of the script, and paste in your own project's values (Firebase console → Project settings → Your apps). Full steps are in the comment right above it.</p>
    <p class="note">Once that's filled in, reload this page.</p>
  </div>`;
}
async function attemptAutoLoad(){
  await refreshIndex();
  try {
    const last = await storage.get(LAST_CODE_KEY, false);
    if (last && last.value){
      const code = JSON.parse(last.value).code;
      const found = await tryLoad(code);
      if (found){ mode = 'event'; }
    }
  } catch(e){ /* fall through to hub */ }
}
(async function init(){
  if (!firebaseReady){ app.innerHTML = notConfiguredHTML(); return; }
  const urlParams = new URLSearchParams(window.location.search);
  const spectateParam = urlParams.get('spectate');
  if (spectateParam){
    await initSpectatorMode(spectateParam);
    return;
  }
  authenticated = checkAuth();
  if (!authenticated){ route(); return; }
  await attemptAutoLoad();
  route();
})();
</script>
